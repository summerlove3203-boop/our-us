<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#FAF7F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OUR:US">
<title>OUR:US</title>
<style>
:root{
  --bg:#FAF7F2;
  --ink:#2B2B2E;
  --muted:#6E6E73;
  --rose:#D88C9A;
  --rose-text:#B5596D;
  --lav:#C9B8E8;
  --line:rgba(43,43,46,.1);
  --fill:#F1ECE5;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;min-height:100%;
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,"SF Pro","Pretendard",BlinkMacSystemFont,sans-serif;
  font-size:16px;-webkit-font-smoothing:antialiased;
  overscroll-behavior-x:none;touch-action:manipulation;
}
body{overflow-x:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0;background:none;color:inherit;padding:0;transition:transform .35s var(--spring),opacity .2s}
button:active{transform:scale(.96);transition-duration:.12s}
.hidden{display:none!important}
svg.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 레이아웃 */
.app{
  width:100%;max-width:520px;min-height:100vh;min-height:100dvh;margin:auto;
  padding:calc(55px + env(safe-area-inset-top)) 22px calc(120px + env(safe-area-inset-bottom));
}
header{
  position:fixed;top:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:520px;z-index:20;
  height:calc(55px + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 10px 0 22px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:.5px solid transparent;
  transition:background .2s,border-color .2s;
}
header.scrolled{
  background:rgba(250,247,242,.86);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom-color:var(--line);
}
.hl{display:flex;align-items:center}
.brand{font-size:13px;font-weight:700;letter-spacing:3px}
.brand span{color:var(--rose-text)}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;color:var(--ink);border-radius:50%}
#backBtn{display:none;margin-left:-16px}
body.immersive #backBtn{display:grid}
body.immersive #settingsBtn{visibility:hidden}
#navTitle{
  position:absolute;left:50%;top:env(safe-area-inset-top);
  height:55px;line-height:55px;transform:translateX(-50%);
  font-size:16px;font-weight:700;letter-spacing:-.02em;
  opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;
}
body:not(.immersive) header.scrolled #navTitle{opacity:1}
body.immersive #navTitle{display:none}

/* 페이지 전환 */
.page{display:none}
.page.active{display:block}
.page.fwd{animation:slideFwd .38s var(--ease) both}
.page.back{animation:slideBack .38s var(--ease) both}
@keyframes slideFwd{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slideBack{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}

/* 타이포 */
.large-title{font-size:34px;line-height:1.2;font-weight:700;letter-spacing:-.03em;margin:14px 0 6px}
.page-desc{font-size:15px;color:var(--muted);margin:0 0 18px}
.title-row{display:flex;align-items:flex-end;justify-content:space-between}
.link-btn{
  min-height:44px;padding:0 4px 0 10px;display:flex;align-items:center;gap:4px;
  color:var(--rose-text);font-size:16px;font-weight:600;
}
.link-btn svg.ic{width:20px;height:20px}
.status{font-size:14px;color:var(--muted);line-height:1.7;margin:8px 0}

/* 홈 */
.greeting small{display:block;font-size:13px;color:var(--muted);margin:16px 0 8px}
.greeting .large-title{margin:0 0 10px}
.dday-row{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.dday{font-size:22px;font-weight:700;letter-spacing:-.5px;color:var(--rose-text)}
.love-sub{font-size:12px;color:var(--muted)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:30px 0 8px}
.section-head h2{font-size:19px;font-weight:700;letter-spacing:-.03em;margin:0}
.section-head small{font-size:12px;color:var(--muted)}

.calendar-head{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px}
.month-label{font-size:17px;font-weight:700;letter-spacing:-.02em}
.month-btn{width:44px;height:44px;color:var(--muted);display:grid;place-items:center;border-radius:50%}
.month-btn svg.ic{width:22px;height:22px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}
.weekday{font-size:11px;color:var(--muted);padding:6px 0;font-weight:600}
.day{height:44px;position:relative;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:15px;transition:background .2s}
.day.muted{color:#C9C4BE}
.day.today .num{background:var(--ink);color:var(--bg);font-weight:700}
.day.selected:not(.today) .num{background:rgba(216,140,154,.2);color:var(--rose-text);font-weight:700}
.dot{position:absolute;bottom:1px;left:calc(50% - 2px);width:4px;height:4px;border-radius:50%;background:var(--rose)}

.selected-area{margin-top:14px;border-top:.5px solid var(--line)}
.selected-head{display:flex;align-items:center;justify-content:space-between;padding-top:6px}
.selected-date{font-size:15px;font-weight:700}
.ev{padding:14px 0;border-bottom:.5px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev-line{display:flex;align-items:stretch;gap:12px}
.ev-time{font-size:13px;color:var(--muted);min-width:44px;padding-top:2px}
.ev-bar{width:3px;border-radius:3px;background:var(--rose);flex:none}
.ev-bar.alt{background:var(--lav)}
.ev-main{min-width:0}
.ev-main strong{display:block;font-size:16px;font-weight:600}
.ev-main small{display:block;font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5;white-space:pre-wrap}
.ev-actions{margin:6px 0 -6px 56px}
.text-btn{min-height:44px;padding:0 14px 0 0;font-size:13px;font-weight:600;color:var(--muted)}
.text-btn.danger{color:var(--rose-text)}
.empty{padding:22px 0;text-align:center;font-size:14px;color:var(--muted)}
.skel{height:16px;border-radius:8px;background:#EDE7DF;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}

.menu-row{
  display:flex;align-items:center;gap:14px;width:100%;min-height:54px;
  border-bottom:.5px solid var(--line);font-size:16px;text-align:left;
}
.menu-row .ic:first-child{color:var(--rose-text)}
.menu-row .chev{margin-left:auto;color:var(--muted);width:18px;height:18px}
.menu-sub{
  margin-left:auto;font-size:13px;color:var(--rose-text);font-weight:600;
  max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.menu-sub+.chev{margin-left:8px}

/* 하단 탭 */
nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:520px;z-index:10;
  height:calc(49px + max(env(safe-area-inset-bottom,0px),34px));
  padding:8px 12px 0;
  background:rgba(250,247,242,.86);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:.5px solid var(--line);
  display:flex;justify-content:space-around;align-items:flex-start;
}
nav button{
  flex:1;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--muted);font-size:10px;font-weight:500;
}
nav button.active{color:var(--rose-text)}
nav button span{letter-spacing:.01em}

/* 폼·시트 */
label{font-size:12px;color:var(--muted);font-weight:600}
input,textarea{
  width:100%;border:0;border-radius:12px;padding:14px;margin:7px 0 14px;
  background:var(--fill);color:var(--ink);outline:none;font-size:16px;
}
input:focus,textarea:focus{box-shadow:0 0 0 1.5px var(--rose)}
textarea{min-height:120px;resize:vertical;line-height:1.7}
.row{display:flex;gap:10px}
.row>div{flex:1;min-width:0}
.primary{
  min-height:52px;width:100%;padding:13px 16px;border-radius:14px;
  background:var(--ink);color:var(--bg);font-weight:600;font-size:16px;margin-top:10px;
}
.primary:disabled{opacity:.4}
.secondary{
  min-height:44px;padding:0 16px;border-radius:12px;background:var(--fill);
  color:var(--ink);font-size:14px;font-weight:600;margin:6px 8px 0 0;
}
.secondary.danger{color:var(--rose-text)}
.sheet-backdrop{
  position:fixed;inset:0;z-index:40;background:rgba(43,43,46,.3);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.sheet-backdrop.show{opacity:1;pointer-events:auto}
.bottom-sheet{
  width:100%;max-width:520px;background:var(--bg);border-radius:20px 20px 0 0;
  padding:10px 22px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(60px);transition:transform .45s var(--spring);
  max-height:92vh;overflow:auto;
}
.sheet-backdrop.show .bottom-sheet{transform:none}
.sheet-handle{width:38px;height:5px;border-radius:5px;background:#D9D3CC;margin:0 auto 18px}
.bottom-sheet h2{font-size:22px;font-weight:700;letter-spacing:-.03em;margin:0 0 14px}
.result-capsule{
  width:64px;height:64px;margin:6px auto 16px;display:block;
}
#resultText{text-align:center;font-size:18px;line-height:1.7;font-weight:600;margin:0 0 6px}

/* 편지 */
.lrow{
  display:flex;align-items:center;gap:14px;width:100%;padding:14px 0;
  border-bottom:.5px solid var(--line);text-align:left;
}
.lrow .lic{
  width:40px;height:40px;border-radius:50%;background:#F3EBDD;color:var(--rose-text);
  display:grid;place-items:center;flex:none;
}
.lrow .lic svg.ic{width:20px;height:20px}
.lbody{flex:1;min-width:0}
.ltop{display:flex;align-items:center;gap:6px}
.ltop b{font-size:16px;font-weight:600}
.ltop em{margin-left:auto;font-style:normal;font-size:12px;color:var(--muted)}
.ldot{width:8px;height:8px;border-radius:50%;background:var(--rose);flex:none}
.lprev{font-size:14px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.letter-overlay{
  position:fixed;inset:0;background:rgba(43,43,46,.32);z-index:30;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.letter-overlay.show{opacity:1;pointer-events:auto}
.letter-stage{
  width:100%;max-width:520px;height:min(85vh,690px);position:relative;
  display:flex;align-items:flex-end;justify-content:center;overflow:hidden;
}
.big-envelope{position:absolute;bottom:25px;width:90%;height:210px;background:#E8DCCB;border-radius:12px;z-index:2}
.big-envelope:before{content:"";position:absolute;inset:0;background:#F2E9DC;border-radius:12px;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.flap{
  position:absolute;top:0;width:100%;height:120px;background:#E2D5C1;
  clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .65s;z-index:4;
}
.seal-big{
  position:absolute;left:calc(50% - 24px);top:72px;width:48px;height:48px;border-radius:50%;
  background:var(--rose);color:#FAF7F2;display:grid;place-items:center;z-index:5;
  box-shadow:0 0 0 3px rgba(181,89,109,.25),0 2px 4px rgba(43,43,46,.15);
}
.seal-big svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.paper{
  position:absolute;bottom:60px;width:84%;height:min(490px,72%);
  background:#FFFDF8;border:.5px solid #EAE2D5;border-radius:6px;
  padding:34px 28px;overflow:auto;
  transform:translateY(120px);opacity:0;transition:transform .7s .2s,opacity .4s .2s;z-index:1;
}
.letter-overlay.open .flap{transform:rotateX(180deg);z-index:0}
.letter-overlay.open .paper{transform:translateY(-25px);opacity:1;z-index:5}
.paper h3{font-size:22px;margin:0 0 8px;letter-spacing:-.03em;font-weight:700}
.paper p{font-size:17px;line-height:1.7;white-space:pre-wrap;margin:0 0 14px}
.paper .date{font-size:12px;color:var(--muted);margin-bottom:20px}
.close-letter{
  position:absolute;top:14px;right:14px;z-index:8;min-height:44px;padding:0 18px;
  border-radius:22px;background:rgba(250,247,242,.92);font-size:14px;font-weight:600;
}

/* 뽑기 */
.machine-wrap{width:min(300px,80vw);margin:6px auto 0}
#machine{width:100%;height:auto;display:block;touch-action:none;overflow:visible;user-select:none;-webkit-user-select:none}
#machine text{font-family:-apple-system,"SF Pro","Pretendard",sans-serif}
.lever{transform-origin:108px 396px;cursor:pointer}
.lever.turn{animation:leverTurn .9s cubic-bezier(.5,0,.3,1)}
@keyframes leverTurn{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.machine-wrap.locked .lever{opacity:.35;pointer-events:none}
.spinning .pl1{animation:shakeA .2s ease-in-out infinite}
.spinning .pl2{animation:shakeB .23s ease-in-out infinite}
.spinning .pl3{animation:shakeC .19s ease-in-out infinite}
@keyframes shakeA{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,-7px)}50%{transform:translate(3px,-3px)}75%{transform:translate(2px,-8px)}}
@keyframes shakeB{0%,100%{transform:translate(0,0)}30%{transform:translate(3px,-5px)}60%{transform:translate(-3px,-8px)}}
@keyframes shakeC{0%,100%{transform:translate(0,0)}35%{transform:translate(-2px,-4px)}70%{transform:translate(3px,-6px)}}
.outcap{opacity:0;pointer-events:none;transform-origin:210px 404px}
.outcap.drop{opacity:1;animation:capDrop .95s cubic-bezier(.3,.7,.4,1) forwards}
.outcap.ready{opacity:1;pointer-events:auto;cursor:pointer;animation:capNudge 1.6s ease-in-out infinite}
.outcap.open{opacity:1;pointer-events:none}
.oc-top{transform-origin:194px 404px;transition:transform .5s var(--spring)}
.outcap.open .oc-top{transform:translate(-12px,-26px) rotate(-34deg)}
@keyframes capDrop{
  0%{opacity:0;transform:translate(-10px,-46px) rotate(-140deg)}
  15%{opacity:1}
  55%{opacity:1;transform:translate(0,0) rotate(0)}
  70%{transform:translate(0,-12px)}
  84%{transform:translate(0,0)}
  92%{transform:translate(0,-4px)}
  100%{opacity:1;transform:translate(0,0)}
}
@keyframes capNudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.draw-result{min-height:56px;display:grid;place-items:center;text-align:center;font-size:16px;font-weight:600;color:var(--rose-text);padding:10px 0 0}
.draw-result .dr-label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.draw-result .dr-title{display:block;font-size:18px;font-weight:700;color:var(--rose-text);line-height:1.5}
.draw-result .dr-foot{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:8px}
.panel{padding:16px 0;margin-top:16px;border-top:.5px solid var(--line)}
.panel>b{font-size:16px}
.draw-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:.5px solid var(--line);font-size:15px}
.draw-item .text-btn{padding-right:0}

/* 설정·기념일 */
.set-row{padding:16px 0;border-bottom:.5px solid var(--line)}
.set-row>b{font-size:16px}
.code{font-size:22px;letter-spacing:6px;font-weight:700;text-align:center;background:var(--fill);padding:16px;border-radius:14px;margin:12px 0}
.anniv-label{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--muted);margin-top:14px}
.anniv-date{font-size:20px;font-weight:700;margin:8px 0 2px;letter-spacing:-.02em}

/* 로그인 */
#authGate{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:22px;overflow:auto}
#authCard{width:min(440px,100%)}
#authCard h1{font-size:30px;letter-spacing:-.03em;margin:14px 0 6px;font-weight:700}
#authCard .panel b{display:block;margin-bottom:4px}

@media(max-width:360px){.app{padding-left:17px;padding-right:17px}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="authGate">
  <div id="authCard">
    <div class="brand">OUR<span>:</span>US</div>
    <h1>우리 둘만의 공간</h1>
    <p class="status">각자 Google 계정으로 로그인한 뒤 함께 연결해줘.</p>
    <button class="primary" id="loginBtn">Google로 로그인</button>
    <div id="pairSetup" class="hidden">
      <div class="panel">
        <b>새로운 우리 공간 만들기</b>
        <button class="primary" id="createPairBtn">우리 공간 만들기</button>
      </div>
      <div class="panel">
        <b>초대 코드로 참여하기</b>
        <input id="joinCode" placeholder="상대의 초대 코드" maxlength="8" autocapitalize="characters">
        <button class="primary" id="joinPairBtn" style="margin-top:0">초대 코드로 연결</button>
      </div>
    </div>
    <p id="authStatus" class="status">로그인이 필요해.</p>
  </div>
</div>

<header id="topbar">
  <div class="hl">
    <button class="iconbtn" id="backBtn" onclick="showPage('home')" aria-label="뒤로가기">
      <svg class="ic" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg>
    </button>
    <div class="brand">OUR<span>:</span>US</div>
  </div>
  <div id="navTitle"></div>
  <button class="iconbtn" id="settingsBtn" onclick="showPage('settings')" aria-label="설정">
    <svg class="ic" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
  </button>
</header>

<div class="app">

<!-- 홈 -->
<section id="home" class="page active">
  <div class="greeting">
    <small id="todayLabel">오늘의 날짜</small>
    <h1 class="large-title">오늘도 우리답게</h1>
    <div class="dday-row"><span class="dday" id="dday">D+—</span><span class="love-sub">2025년 9월 3일 · 처음 만난 날</span></div>
  </div>

  <div class="section-head"><h2>우리의 캘린더</h2><small>함께 기록하는 하루</small></div>
  <div id="homeCalendar">
    <div class="calendar-head">
      <button class="month-btn" onclick="changeMonth(-1)" aria-label="이전 달"><svg class="ic" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
      <div class="month-label" id="monthLabel"></div>
      <button class="month-btn" onclick="changeMonth(1)" aria-label="다음 달"><svg class="ic" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
    <div class="selected-area">
      <div class="selected-head">
        <div class="selected-date" id="selectedDateLabel"></div>
        <button class="link-btn" onclick="toggleEventForm()"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>일정 추가</button>
      </div>
      <div id="eventList"></div>
    </div>
  </div>

  <div class="section-head"><h2>우리의 공간</h2></div>
  <div>
    <button class="menu-row" onclick="showPage('letters')">
      <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
      열어봐 편지
      <svg class="ic chev" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>
    </button>
    <button class="menu-row" onclick="showPage('draw')">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/></svg>
      랜덤 뽑기
      <span class="menu-sub" id="homeDrawSub"></span>
      <svg class="ic chev" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>
    </button>
    <button class="menu-row" onclick="showPage('anniversary')">
      <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
      기념일
